#database configurations

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
#    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

#OpenAi configurations
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
#      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}
        temperature: ${OPENAI_TEMPERATURE:0.2}
#      max-tokens: ${OPENAI_MAX_TOKENS:2048}

      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
#        temperature: ${OPENAI_EMBEDDING_TEMPERATURE:0.2}


    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimension: 1536
        table-name: docmind_vectors
        schema-name: public
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB

#app configurations
app:
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:700}
#    chunk-overlap: ${RAG_CHUNK_OVERLAP:50}
#    max-chunks: ${RAG_MAX_CHUNKS:5}
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.0}

  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

# jwt configurations
jwt:
  secret: ${JWT_SECRET:sdafasfasfasdhfojhascapfdaDHAfbashfabfashfasbfshfdasfhqf}
  expiration: ${JWT_EXPIRATION:3600000}


bootui:
  enabled: ${BOOTUI_ENABLED:ON}